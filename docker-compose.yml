version: '3.8'

networks:
  smartcity-net:
    name: smartcity-net
    driver: bridge

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: citytwin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-citytwin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - smartcity-net
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-citytwin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  osm-ingest:
    image: iboates/osm2pgsql:latest
    container_name: citytwin-osm-ingest
    networks:
      - smartcity-net
    volumes:
      - ./:/osm
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["osm2pgsql"]
    command: [
      "-c",
      "-d",
      "postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-citytwin}",
      "/osm/NewYork.osm.pbf"
    ]
    profiles:
      - ingest

  node-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citytwin-node-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-citytwin}
      PORT: ${PORT:-3000}
    networks:
      - smartcity-net
    depends_on:
      db:
        condition: service_healthy

  ai-oracle:
    build:
      context: ./ai-oracle
      dockerfile: Dockerfile
    container_name: citytwin-ai-oracle
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-citytwin}
    networks:
      - smartcity-net
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: citytwin-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - smartcity-net
    depends_on:
      - node-api
      - ai-oracle

volumes:
  pgdata:
